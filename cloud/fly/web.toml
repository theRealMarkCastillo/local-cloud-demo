primary_region = "iad"
[build]
  dockerfile = "web/Dockerfile"
[env]
  PORT = "8080"
  # Replace these two hostnames with YOUR-PREFIX-api.internal before deployment.
  API_UPSTREAM = "workbench-api.internal:8000"
  IDENTITY_UPSTREAM = "workbench-api.internal:8000"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
