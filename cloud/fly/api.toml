# Use --app YOUR-PREFIX-api. Run from repository root.
primary_region = "iad"
[build]
  dockerfile = "backend/Dockerfile"
[deploy]
  release_command = "python -m app.migrate"
[env]
  PORT = "8000"
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  [[http_service.checks]]
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
